name: Shurik
run-name: ${{ github.event_name == 'schedule' && 'Shurik recovery' || (inputs.command == 'iterate' && format('Shurik {0} / {1}', inputs.loop_id, inputs.iteration) || format('Shurik {0} / {1}', inputs.loop_id || 'session-journals-demo', inputs.command || 'resume')) }}
on:
  push:
    branches: [main]
    paths: [.github/workflows/shurik.yml]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Start, stop or resume a loop; iterate is used by Shurik
        required: true
        type: choice
        options: [start, stop, resume, iterate]
        default: start
      loop_id:
        description: Loop ID and task branch; use main to work directly on main
        required: true
        type: string
      reasoning:
        description: Required for start/resume (off, minimal, low, medium, high, xhigh, max)
        type: string
      provider:
        description: Optional Pi AI provider; resume keeps the previous provider
        type: string
      model:
        description: Optional model; resume keeps the previous model
        type: string
      create_pr:
        description: Create draft PRs when allowed (auto), always try (true), or disable (false)
        type: choice
        options: [auto, 'true', 'false']
        default: auto
      source_ref:
        description: Source for a new task branch; existing branches use their current tip
        type: string
      work-seconds:
        description: Work budget per iteration for start/resume (10–1800 seconds)
        type: string
      wait-seconds:
        description: Idle seconds after each iteration; 0 continues immediately, blank resume retains it
        type: string
      deadline:
        description: Optional absolute UTC deadline for start/resume
        type: string
      generation:
        description: Internal continuation generation
        default: '1'
        type: string
      iteration:
        description: Continuous iteration number across resumes
        default: '1'
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  control:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.command != 'iterate')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: shurik-control-${{ inputs.loop_id || 'session-journals-demo' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set demo deadline
        id: demo
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta, timezone
          deadline = datetime.now(timezone.utc) + timedelta(minutes=30)
          print("deadline=" + deadline.isoformat(timespec="seconds").replace("+00:00", "Z"))
          PY
      - id: shurik
        uses: igor-makarov/shurik@session-journals
        with:
          command: ${{ github.event_name == 'push' && 'resume' || inputs.command }}
          loop-id: ${{ inputs.loop_id || 'session-journals-demo' }}
          reasoning: ${{ inputs.reasoning || (github.event_name == 'push' && 'high' || '') }}
          deadline: ${{ inputs.deadline || steps.demo.outputs.deadline }}
          inputs: ${{ toJSON(inputs) }}
          workflow: shurik.yml
          checkpoint-seconds: 60
          provider: ${{ inputs.provider || (github.event_name == 'push' && 'opencode-go' || '') }}
          model: ${{ inputs.model || (github.event_name == 'push' && 'beam-free' || '') || (inputs.command == 'start' && (!inputs.provider || inputs.provider == 'opencode-go') && 'deepseek-v4.1-flash' || '') }}
          work-seconds: ${{ inputs['work-seconds'] || (github.event_name == 'push' && '900' || '') || (inputs.command == 'start' && '120' || '') }}
          wait-seconds: ${{ inputs['wait-seconds'] || (github.event_name == 'push' && '0' || '') }}
          prompt: PROMPT.md
          checkpoint-paths: '[]'
      - name: Preserve emergency snapshot after publication failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shurik-emergency-${{ github.run_id }}
          path: ${{ steps.shurik.outputs.emergency-path }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  iteration:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'iterate' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: shurik-worker-${{ inputs.loop_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: shurik
        uses: igor-makarov/shurik@session-journals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          command: iterate
          inputs: ${{ toJSON(inputs) }}
      - name: Preserve emergency snapshot after publication failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shurik-emergency-${{ github.run_id }}
          path: ${{ steps.shurik.outputs.emergency-path }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  recovery:
    needs: [control, iteration]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: igor-makarov/shurik@session-journals
        env:
          SHURIK_ITERATION_RESULT: ${{ needs.iteration.result }}
        with:
          command: recover
